<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Assessment Application</title>
    <!-- Load Bootstrap CSS for styling and responsive layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
    <!-- Main content wrapper using flexbox for vertical and horizontal centering -->
    <div id="divContent" class="col-12 d-flex justify-content-center align-items-center min-vh-100">
        <!-- Initial selection card shown to user with Register and Login options -->
        <div class="col-12 col-md-6 col-lg-4 card" id="divSelect">
            <div class="card-body">
                <h2 class="text-center">Peer Assessment Application</h2>
                <!-- Action buttons -->
                <div class="mt-5 d-flex justify-content-around">
                    <button class="btn btn-primary" id="btnRegisterButton">Register</button>
                    <button class="btn btn-primary" id="btnLoginButton">Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load required JavaScript libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Load app-specific scripts -->
    <script src="js/app.js"></script> <!-- Shared logic -->
    <script src="js/instructor.js"></script> <!-- Instructor-specific behavior -->
    <script src="js/student-clean.js"></script> <!-- Student-specific behavior -->
</body>
</html>
