<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
    <!-- Main content, centered using flexbox -->
    <div id="divContent" class="col-12 d-flex justify-content-center align-items-center min-vh-100">
        <!-- Selection card (initially visible) -->
        <div class="col-12 col-md-6 col-lg-4 card" id="divSelect">
            <div class="card-body">
                <h2 class="text-center">Peer Assessment Application</h2>
                <div class="mt-5 d-flex justify-content-around">
                    <button class="btn btn-primary" id="btnRegisterButton">Register</button>
                    <button class="btn btn-primary" id="btnLoginButton">Login</button>
                </div>
            </div>
        </div>

        <!-- Registration Form (Initially hidden) -->
        <form class="card col-12 col-md-6 col-lg-4" id="frmRegister" style="display:none;">
            <div class="card-body">
                <h1 class="text-center mb-4">Register Account</h1>
                <input id="txtFirstName" class="form-control mt-2" type="text" placeholder="First Name" aria-label="first name text box">
                <input id="txtLastName" class="form-control mt-2" type="text" placeholder="Last Name" aria-label="last name text box">
                
                <div class="mt-2">
                    <label for="roleSelect">Select Role:</label>
                    <select class="form-control" id="roleSelect">
                        <option value="" selected disabled>Select Role</option>
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                    </select>
                </div>

                <input id="txtUsername" class="form-control mt-4" type="email" placeholder="Email" aria-label="email">
                <input id="txtPassword" class="form-control mt-2" type="password" placeholder="Password" aria-label="password">
                
                <div id="studentContact" style="display: none;">
                    <!-- Select dropdown for contact type -->
                    <select id="contactType" class="form-control mt-2">
                        <option value="" selected disabled>Select form of contact information</option>
                        <option value="mobile">Mobile</option>
                        <option value="discord">Discord</option>
                        <option value="teams">Teams</option>
                    </select>
                    <!-- Input for contact info -->
                    <input id="txtContact" class="form-control mt-2" type="text" placeholder="Enter your contact info" aria-label="contact information (either phone number, discord name, or teams name)">
                </div>
                
                <button class="btn btn-primary col-12 mt-3" type="button" id="btnRegister">Register</button>
                <button class="btn btn-link col-12 mt-2" type="button" id="btnSwapLogin">Back to Login</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>
</html>
